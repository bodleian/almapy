# Zensical configuration — https://zensical.org/docs/setup/basics/
#
# Zensical is pre-1.0 and its config schema may still move; the version is
# pinned in the `docs` dependency group in pyproject.toml so a 0.0.x release
# cannot break the docs build on an unrelated PR.

[project]
site_name = "almapy"
site_description = "Async Python wrapper for the Ex Libris Alma API"
site_author = "Ben Gable"
site_url = "https://bodleian.github.io/almapy/"

repo_url = "https://github.com/bodleian/almapy"
repo_name = "bodleian/almapy"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; Bodleian Libraries, University of Oxford — MIT licensed
"""

# Explicit rather than derived from the directory tree, so the guide reads in
# a deliberate order (concepts before reference) instead of alphabetically.
# https://zensical.org/docs/setup/navigation/
nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    "guide/getting-started.md",
    "guide/responses.md",
    "guide/errors.md",
    "guide/rate-limiting.md",
    "guide/logging.md",
  ] },
  { "API reference" = [
    "api/client.md",
    "api/users.md",
    "api/bibs.md",
    "api/acq.md",
    "api/config.md",
    "api/analytics.md",
    "api/primo.md",
    "api/exceptions.md",
    "api/advanced.md",
  ] },
]

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# https://zensical.org/docs/setup/colors/
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Markdown extensions
#
# Zensical does not enable these implicitly: admonition and pymdownx.details
# drive the !!! note blocks, and attr_list with md_in_html drives the card
# grid on the landing page.
# https://zensical.org/docs/setup/extensions/python-markdown/
# ---------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# ---------------------------------------------------------------------------
# API reference generation
# https://zensical.org/docs/setup/extensions/mkdocstrings/
# ---------------------------------------------------------------------------
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"

# The namespace methods are three-way @overload groups whose implementation
# signature is (self, ..., model: Any = None) -> Any, which documents nothing.
# overloads_only drops it and renders the two typed overloads instead; the
# docstring lives on the implementation and still renders.
show_overloads = true
overloads_only = true

separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
modernize_annotations = true
merge_init_into_class = true
show_root_heading = true
show_root_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
filters = ["!^_"]
