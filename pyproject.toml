[project]
name = "almapy"
version = "9.0.0"
description = "Async Python wrapper for the Ex Libris Alma API"
readme = "README.md"
requires-python = ">=3.11.0, <4.0.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Gable", email = "ben.gable@bodleian.ox.ac.uk" }]
keywords = [
  "alma",
  "ex-libris",
  "exlibris",
  "library",
  "libraries",
  "ils",
  "lsp",
  "marc",
  "api-client",
  "async",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "niquests>=3.18.4",
  "xmltodict>=0.13.0",
  "python-box>=7.2.0",
  "glom>=23.5.0",
  "stamina>=25.2.0",
  "urllib3-future[rtls]>=2.19.902",
]

[project.urls]
Homepage = "https://github.com/bodleian/almapy"
Repository = "https://github.com/bodleian/almapy"
Issues = "https://github.com/bodleian/almapy/issues"
Changelog = "https://github.com/bodleian/almapy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "README.md",
  "CHANGELOG.md",
  "pyproject.toml",
]
# An explicit `include` bypasses hatchling's VCS-ignore handling, so anything
# untracked but sitting in the working tree gets packed. Integration credentials
# and patron data therefore live outside tests/ (see .env.example); these
# patterns are a tripwire in case they are ever recreated here out of habit.
# `just publish` re-scans the built artifacts as a final backstop.
exclude = [
  "tests/.env",
  "tests/*.env",
  "tests/barcodes.txt",
]

[tool.uv]
publish-url = "https://gitlab.bodleian.ox.ac.uk/api/v4/projects/779/packages/pypi"

[dependency-groups]
dev = [
  "commitizen>=3.29.0",
  "coverage>=7.6.1",
  "mypy>=1.11.1",
  "pre-commit>=3.5.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-clarity>=1.0.1",
  "pytest-mock>=3.14.0",
  "niquests-mock>=0.4.0",
  "ruff>=0.13.2",
  "safety>=3.6.2",
  "typeguard>=4.3.0",
  "environs>=11.0.0",
  "deptry>=0.25.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "$version"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
fail_under = 50
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run] # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.xml] # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.mypy] # https://mypy.readthedocs.io/en/latest/config_file.html
junit_xml = "reports/mypy.xml"
strict = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[tool.pytest.ini_options] # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--import-mode=importlib --color=yes --doctest-modules --exitfirst --failed-first --strict-config --strict-markers --typeguard-packages=almapy --verbosity=2 --junitxml=../reports/pytest.xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = ["integration: marks tests as requiring a live Alma API and ALMA_INTEGRATION=1 env var"]
testpaths = ["src", "tests"]
xfail_strict = true


[tool.ruff] # https://github.com/charliermarsh/ruff
fix = true

line-length = 100
preview = true
src = ["src", "tests"]
target-version = "py311"


[tool.ruff.lint]
select = [
  # flake8-2020
  "YTT",
  # flake8-bandit
  "S",
  # flake8-bugbear
  "B",
  # flake8-builtins
  "A",
  # flake8-comprehensions
  "C4",
  # flake8-debugger
  "T10",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  "W",
  # pyflakes
  "F",
  # pygrep-hooks
  "PGH",
  # pyupgrade
  "UP",
  # ruff
  "RUF",
  # tryceratops
  "TRY",
]


ignore = ["E501", "S307", "RET504", "S101", "PERF203", "D107", "ISC001"]

unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.deptry]
known_first_party = ["almapy"]

[tool.deptry.per_rule_ignores]
# urllib3-future[rtls] is niquests' runtime urllib3 backend (pinned here for the
# [rtls] TLS extra); almapy never imports it directly, so DEP002 is a false positive.
DEP002 = ["urllib3-future"]
